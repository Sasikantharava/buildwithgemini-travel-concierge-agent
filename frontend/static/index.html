<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Concierge</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-light: #ccfbf1;
    --accent-gradient: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 12px rgba(13, 148, 136, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);
  }

  body.dark-mode {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-light: #134e4a;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    transition: background 0.25s ease, color 0.25s ease;
  }

  header {
    background: var(--accent-gradient);
    color: #ffffff;
    padding: 0.8rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(13, 148, 136, 0.2);
    z-index: 10;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .header-icon {
    font-size: 1.5rem;
    background: rgba(255, 255, 255, 0.2);
    padding: 0.4rem;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .header-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: -0.01em;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .icon-btn {
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    backdrop-filter: blur(4px);
    padding: 0;
  }

  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.05);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  /* Message Styles */
  .msg-wrapper {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
    animation: fadeInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .msg-wrapper.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-wrapper.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    font-weight: 600;
  }

  .msg-wrapper.user .avatar {
    background: var(--border);
    color: var(--text-secondary);
  }

  .msg-wrapper.agent .avatar {
    background: var(--accent-gradient);
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(13, 148, 136, 0.3);
  }

  .bubble {
    padding: 0.75rem 1.1rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 0.95rem;
    line-height: 1.5;
    box-shadow: var(--shadow-sm);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-wrapper.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(13, 148, 136, 0.25);
  }

  .msg-wrapper.agent .bubble {
    border-top-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Animated Typing Dots */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.3rem 0.5rem;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Quick Prompts Container */
  #quick-prompts {
    display: flex;
    gap: 0.6rem;
    padding: 0.6rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #quick-prompts::-webkit-scrollbar { display: none; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-sm);
  }

  .chip:hover {
    background: var(--accent-light);
    color: var(--accent-dark);
    border-color: rgba(13, 148, 136, 0.3);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* Footer & Input Controls */
  .footer-container {
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 0.75rem 1rem 1rem;
  }

  form {
    display: flex;
    gap: 0.6rem;
    max-width: 820px;
    margin: 0 auto;
    position: relative;
  }

  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: var(--bg);
    color: var(--text-primary);
  }

  input:focus {
    border-color: var(--accent);
    background: var(--card-bg);
    box-shadow: 0 0 0 3.5px rgba(13, 148, 136, 0.15);
  }

  form button[type="submit"] {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: 24px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(13, 148, 136, 0.3);
  }

  form button[type="submit"]:hover {
    opacity: 0.94;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(13, 148, 136, 0.4);
  }

  /* A2UI Component Styles */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
    margin-top: 0.4rem;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h2 { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; }
  .a2text.a2-h3 { font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-top: 0.4rem; cursor: pointer; transition: transform 0.2s ease; }
  .a2img:hover { transform: scale(1.02); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  .a2action-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.35rem 0.75rem;
    border: 1px solid var(--accent);
    border-radius: 16px;
    background: var(--accent-light);
    color: var(--accent-dark);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: all 0.15s ease;
  }
  .a2action-btn:hover {
    background: var(--accent);
    color: #ffffff;
  }

  /* Lightbox Modal */
  .lightbox-modal {
    display: none;
    position: fixed;
    z-index: 1000;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(6px);
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
  }
  .lightbox-modal.active { display: flex; animation: fadeIn 0.2s ease; }
  .lightbox-modal img { max-width: 90vw; max-height: 85vh; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .lightbox-close {
    position: absolute; top: 1.5rem; right: 2rem;
    color: #ffffff; font-size: 2.2rem; cursor: pointer; font-weight: 700;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-icon">
      <span class="material-symbols-outlined" style="color:#fff; font-size:1.4rem;">explore</span>
    </div>
    <div class="header-title">Travel Concierge</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="theme-toggle" title="Toggle dark mode">
      <span class="material-symbols-outlined" style="font-size:1.2rem;">dark_mode</span>
    </button>
    <button class="icon-btn" id="export-chat" title="Export itinerary log">
      <span class="material-symbols-outlined" style="font-size:1.2rem;">download</span>
    </button>
    <button class="icon-btn" id="clear-chat" title="Clear chat session">
      <span class="material-symbols-outlined" style="font-size:1.2rem;">delete</span>
    </button>
  </div>
</header>

<div id="log"></div>

<div class="footer-container">
  <div id="quick-prompts">
    <button type="button" class="chip" data-prompt="Find travel spots in San Francisco">📍 Spots in San Francisco</button>
    <button type="button" class="chip" data-prompt="Generate a visual image for Japanese Tea Garden">🎨 Destination image</button>
    <button type="button" class="chip" data-prompt="Calculate budget for a 5 day trip at $150 per day">💰 5-day trip budget</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask Travel Concierge anything…" autocomplete="off" autofocus>
    <button type="submit">
      <span>Send</span>
      <span class="material-symbols-outlined" style="color:#fff; font-size:1.1rem;">send</span>
    </button>
  </form>
</div>

<!-- Image Lightbox Modal -->
<div id="lightbox" class="lightbox-modal">
  <span class="lightbox-close" id="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="Destination Preview">
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const themeToggle = document.getElementById("theme-toggle");
const clearChatBtn = document.getElementById("clear-chat");
const exportChatBtn = document.getElementById("export-chat");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxClose = document.getElementById("lightbox-close");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const wrapper = el("div", "msg-wrapper " + who);
  const avatar = el("div", "avatar", who === "user" ? "U" : "🧳");
  const b = el("div", "bubble");
  
  wrapper.appendChild(avatar);
  wrapper.appendChild(b);
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator(b) {
  b.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card");
      kids().forEach(n => d.appendChild(n));
      // Auto-append quick action button to destination cards
      const titleNode = d.querySelector(".a2-h1, .a2-h2, .a2-h3");
      if (titleNode && titleNode.textContent) {
        const destName = titleNode.textContent.trim();
        const actionBtn = el("button", "a2action-btn", "🎨 Preview Image");
        actionBtn.setAttribute("data-prompt", `Generate a visual image for ${destName}`);
        actionBtn.type = "button";
        actionBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          input.value = actionBtn.getAttribute("data-prompt");
          form.dispatchEvent(new Event("submit", { cancelable: true }));
        });
        d.appendChild(actionBtn);
      }
      return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || "Destination Image";
      img.addEventListener("click", () => {
        lightboxImg.src = src;
        lightbox.classList.add("active");
      });
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  showTypingIndicator(b);
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

/* Chip prompts */
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    input.value = c.getAttribute("data-prompt");
    form.dispatchEvent(new Event("submit", { cancelable: true }));
  });
});

/* Theme toggle */
themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  const isDark = document.body.classList.contains("dark-mode");
  themeToggle.querySelector(".material-symbols-outlined").textContent = isDark ? "light_mode" : "dark_mode";
});

/* Clear chat */
clearChatBtn.addEventListener("click", () => {
  log.innerHTML = "";
});

/* Export chat log */
exportChatBtn.addEventListener("click", () => {
  const text = Array.from(log.querySelectorAll(".msg-wrapper")).map(w => {
    const who = w.classList.contains("user") ? "User" : "Concierge";
    const body = w.querySelector(".bubble").innerText || "";
    return `[${who}]: ${body}`;
  }).join("\n\n");
  const blob = new Blob([text], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "travel_concierge_itinerary.txt";
  a.click();
});

/* Lightbox close */
lightboxClose.addEventListener("click", () => lightbox.classList.remove("active"));
lightbox.addEventListener("click", (e) => { if (e.target === lightbox) lightbox.classList.remove("active"); });
</script>
</body>
</html>
